# Universo vivo. Uso:
#   docker compose up -d --build     arranca el universo natural en segundo plano (retoma solo si ya existía)
#   docker compose logs -f natural   muestra su avance
#   docker compose stop              lo detiene: termina el paso, guarda y sale
# Los datos quedan en ./runs/vivo/natural (estado.pkl, metricas.jsonl, eventos.jsonl, linaje/, poblacion.npz).
services:
  # Universo natural (desde 2026-10-31, principio 7): clima real de Capitán Bermúdez y nada de fuerzas diseñadas.
  # Sin resembrar: si se extingue, se detiene; una extinción es un dato, no algo que corregir.
  natural:
    build: .
    image: simbio-vivo
    volumes:
      - ./runs/vivo:/datos
      - ./datos:/simbio/datos:ro
    command: ["experiments/configs/natural.toml", "--salida", "/datos/natural", "--guardar-cada", "10000",
              "--sin-resembrar"]
    network_mode: none
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: 0.5

  # Universos de la fase 12, retirados el 2026-10-31: tenían fuerzas diseñadas (depredador externo, estaciones y
  # la lluvia decidiendo qué comida nutre). Sus datos quedan en ./runs/vivo/universo y ./runs/vivo/clima. Solo
  # arrancan a pedido: docker compose --profile historico up -d universo clima
  universo:
    image: simbio-vivo
    profiles: ["historico"]
    volumes:
      - ./runs/vivo:/datos
    network_mode: none          # sin internet: los datos externos entran por una carpeta (etapa 2)
    restart: unless-stopped     # si el equipo se reinicia, el universo retoma desde su último guardado
    stop_grace_period: 60s      # tiempo para guardar al detenerlo
    cpus: 0.5                   # medio núcleo: el equipo sigue usable (solo cambia la velocidad, no el resultado)

  # Universo con el clima real de Capitán Bermúdez (etapa 2). Los datos del clima entran por ./datos, en solo
  # lectura; los trae antes, fuera del contenedor, experiments/herramientas/descargar_clima.py.
  # Recibe estímulos (etapa 3): python -m simbio estimular runs/vivo/clima --texto "hola"
  # Datos en ./runs/vivo/clima.
  clima:
    image: simbio-vivo
    profiles: ["historico"]
    volumes:
      - ./runs/vivo:/datos
      - ./datos:/simbio/datos:ro
    command: ["experiments/configs/clima.toml", "--salida", "/datos/clima", "--guardar-cada", "10000",
              "--set", "estimulos.activo=true"]
    network_mode: none
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: 0.5

  # Experimentos (pilotos de las fases): corren en un contenedor, sin ventanas en el escritorio y sin depender de la
  # app de Claude. No arranca con "up" (perfil propio). Usa el código del repositorio montado (no hace falta
  # reconstruir la imagen) y guarda en ./runs. Ejemplo:
  #   docker compose --profile experimentos run -d --name fase13-controles experimento experiments/fase13/piloto.py --procesos 4 ...
  # Cada script guarda su avance en *.parcial.json: el mismo comando retoma donde quedó.
  experimento:
    image: simbio-vivo
    profiles: ["experimentos"]
    working_dir: /repo
    entrypoint: ["python"]
    environment:
      - PYTHONPATH=/repo/src
      - PYTHONUNBUFFERED=1
      - SIMBIO_DISPOSITIVO=cpu
    volumes:
      - ./src:/repo/src:ro
      - ./experiments:/repo/experiments:ro
      - ./datos:/repo/datos:ro
      - ./runs:/repo/runs
    network_mode: none
    cpus: 4                     # un tercio del equipo: el autor sigue usando la PC (con --procesos 4)
