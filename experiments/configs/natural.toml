# Universo natural (principio 7 de la metodología): nada de fuerzas diseñadas y nada traído de la Tierra.
# - Física base: comer da energía, moverse y vivir cuestan, dividirse reparte. Todos empiezan como LUCA y comen lo mismo.
# - Mundo digital con física propia (autor, 2026-11-01): el clima real de Capitán Bermúdez se quitó. Es del mundo
#   físico del autor, no del mundo donde habita LUCA. La comida recrece a ritmo constante; la variación y las presiones
#   salen de la propia población (escasez, competencia, depredación que evoluciona). La versión con clima
#   (2026-10-31 a 2026-11-01, ~4 millones de pasos) quedó en runs/vivo/natural_clima como dato histórico.
# - Sin depredador externo ni estaciones artificiales: la depredación solo existe si evoluciona. La primitiva atacar
#   está disponible para el genoma, pero LUCA no la tiene; aparece por mutación cuando, al escasear la comida,
#   comerse a otro rinde.
# - El genoma puede ganar todo lo que la física permite: asociarse (movimiento de grupo por fuerza, α = 0,5, el de la
#   fase 3c), percibir el rumbo de los socios, atacar y la red regulatoria del desarrollo.
# - Su mundo físico es el equipo donde corre (autor, 2026-11-01): la comida recrece según la CPU libre del equipo
#   (EquipoCfg). Si el lector del equipo no anda, queda el último valor; todo lo aplicado se graba en equipo.jsonl.
# - capacidad_max = 20: un mundo rico, elegido una vez. No se retoca según los resultados.
[mundo]
alto = 128
ancho = 128
capacidad_max = 20.0

[asociacion]
movimiento = "fuerza"
exponente_arrastre = 0.5

[coordinacion]
rumbo = true

[ataque]
activo = true
# comerse a otro depende del tamaño (más fiel a la realidad, aprobado por el autor el 2026-10-30, tras el piloto
# de la red): una célula sola apenas puede con un grupo grande. Antes: el daño solo se dividía por 1 + enlaces
tamano = true

[desarrollo]
activo = true

[equipo]
activa = true
# cada 100 pasos (~2 s a 50 pasos/s): así cada muestra (una cada 10 s) dura en el universo lo que duró en el equipo.
# Con 1000 pasos (~20 s) una muestra pesaba el doble de lo real y la mitad de las muestras no llegaba a sentirse
revisar_cada = 100

[sim]
poblacion_inicial = 200
registrar_cada = 1000
