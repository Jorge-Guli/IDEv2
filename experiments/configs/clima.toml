# Universo con clima real (fase 12, etapa 2): el mundo del universo vivo (vivo.toml, el de la fase 11 desde LUCA
# puro) con el clima horario de Capitán Bermúdez (Santa Fe, Argentina), 2000-2025, regulando el mundo:
#   radiación → recrecimiento de la comida; temperatura → costo basal; lluvia → qué comida nutre (reemplaza a la
#   estación artificial: seco, tipo A; húmedo, tipo B); presión → sensor local con su tendencia de 24 horas.
# Calibrado de viabilidad (experiments/fase12/viabilidad_clima.py): con el recrecimiento solo de día (acople 1)
# la población crece de día y muere entera de noche; con acople 0,5 y capacidad 10, la mitad de las semillas se
# extingue cuando la toxicidad llega a pleno; con acople 0,5 y capacidad_max = 15, sobreviven 4 de 4.
