[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simbio"
version = "0.1.0"
description = "Simulación de vida artificial: de la autonomía individual a la organización colectiva"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# GPU NVIDIA (opcional): elegir el paquete de CuPy que corresponda a la versión de CUDA del equipo
# [ctk] instala por pip las cabeceras de CUDA que CuPy necesita para compilar (no hace falta el CUDA Toolkit)
gpu-cuda12 = ["cupy-cuda12x[ctk]"]
gpu-cuda13 = ["cupy-cuda13x[ctk]"]

[project.scripts]
simbio = "simbio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
